# @package _global_
training:
  task_name: L1WArmManipLoco
  sim_backend: mujoco
  log_root: logs/him-mujoco-l1w
algo:
  num_envs: 4096
  max_iterations: 3000
  num_one_step_obs: 88
  num_actor_history: 5
  num_critic_history: 1
  empirical_normalization: true
  policy:
    init_noise_std: 0.5
  algorithm:
    learning_rate: 0.0003
    entropy_coef: 0.001
  estimator:
    velocity_target_start: 0
    target_obs_start: 3
reward:
  tracking_lin_vel:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: 2.0
    params:
      name: tracking_lin_vel
  tracking_ang_vel:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: 1.0
    params:
      name: tracking_ang_vel
  lin_vel_z:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -10.0
    params:
      name: lin_vel_z
  ang_vel_xy:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -0.1
    params:
      name: ang_vel_xy
  roll:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -5.0
    params:
      name: roll
  base_height:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -10.0
    params:
      name: base_height
  leg_pose:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -2.0
    params:
      name: leg_pose
  hip_pos:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -0.02
    params:
      name: hip_pos
  mirrorup:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -0.1
    params:
      name: mirrorup
  action_rate:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -0.02
    params:
      name: action_rate
  dof_acc:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -2.5e-7
    params:
      name: dof_acc
  stand_still:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -0.8
    params:
      name: stand_still
  wheel_stand_still:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -0.02
    params:
      name: wheel_stand_still
  contact:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: 0.24
    params:
      name: contact
  swing_feet_z:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: 10.0
    params:
      name: swing_feet_z
  # foot_drag:
  #   func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
  #   weight: -0.5
  #   params:
  #     name: foot_drag
  object_distance:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: 2.0
    params:
      name: object_distance
  object_distance_l2:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -0.5
    params:
      name: object_distance_l2
  arm_collision:
    func: legged_manipulation_unilab.tasks.l1_w_arm.manager_env.L1WArmReward
    weight: -1.0
    params:
      name: arm_collision
env:
  control_config:
    leg_kp: 50.0
    leg_kd: 1.0
  goal_ee:
    sphere_l_range:
    - 0.3
    - 0.6
    sphere_phi_range:
    - -1.2566
    - 1.0472
    sphere_theta_range:
    - -2.3562
    - 2.3562
    traj_time_range:
    - 1.0
    - 3.0
    hold_time_range:
    - 0.5
    - 2.0
    collision_upper_limits:
    - 0.3
    - 0.15
    - -0.115
    collision_lower_limits:
    - -0.2
    - -0.15
    - -0.515
    underground_limit: -0.57
    num_collision_check_samples: 10
    num_resample_attempts: 10
    init_ee_cart:
    - 0.3
    - 0.0
    - 0.25
  ik:
    damping: 0.05
    gain: 1.0
    dq_clip: 0.2
    use_orientation: false
  command_config:
    vel_limit:
    - - -0.6
      - -0.4
      - -0.8
    - - 1.0
      - 0.4
      - 0.8
    zero_command_prob: 0.15
    pure_x_command_prob: 0.35
    resample_time_s: 4.0
    gait_frequency: 1.8
    gait_x_threshold: 0.5
    gait_lateral_threshold: 0.08
    gait_yaw_threshold: 0.12
  curriculum_config:
    enable: false
    threshold: 0.8
    step_size:
    - 0.1
    - 0.05
    - 0.1
    max_vel_limit:
    - 1.0
    - 0.4
    - 0.8
  history:
    num_actor_history: 5
    num_critic_history: 1
  domain_rand:
    randomize_base_mass: true
    added_mass_range:
    - -1.0
    - 1.0
    randomize_body_mass: true
    body_mass_body_names:
    - arm_base
    - link1
    - link2
    - link3
    - link4
    - link5
    - link6
    body_mass_multiplier_range:
    - 0.9
    - 1.1
    random_com: true
    com_offset_x:
    - -0.03
    - 0.03
    randomize_gravity: false
    push_robots: true
    push_interval: 500
    max_force:
    - 1.2
    - 1.2
    - 0.6
    push_body_name: BASE_LINK
    randomize_kp: false
    kp_multiplier_range:
    - 0.9
    - 1.1
    randomize_kd: false
    kd_multiplier_range:
    - 0.9
    - 1.1
  arm_stage:
    freeze_arm_joints: false
    disable_ee_goal_trajectory: false
    fixed_ee_goal_cart:
    - 0.3
    - 0.0
    - 0.25
  reward_parameters:
    tracking_sigma: 0.25
    base_height_target: 0.35
    object_sigma: 0.1
    # Wheel-center swing target: 0.071 m tire radius + about 0.03 m clearance.
    target_foot_height: 0.08
